<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div class="container">
      	<div class="content">
      		<div style="color: red; position: absolute; background: white; padding: 10px; right: 5%; display:none" id="connectAlarm">※ 로봇과의 연결이 끊겼습니다.</div>
      		
      		<h2 class="header">Recycle Monitoring</h2>
            <nav class="tab-menu">
                <a href="/dashboard" class="tab active">대시보드</a>
                <a href="/eventLog" class="tab">이벤트 로그</a>
                <a href="/recycleHistory" class="tab">쓰레기 수거 현황</a>
                <a href="/schedule" class="tab">스케줄 관리</a>
                <a href="/setting" class="tab">정보 / 설정</a>
            </nav>

            <div class="dashboard">
                <div class="dflex mb20" style="justify-content: space-between !important;">
                    <!-- 오늘의 작업 현황 -->
                    <div class="today-summary">
                        <h4>※ 오늘의 작업 현황</h4>
                        <span class="today-summary-span ml20">수거 <b class="ml10" id="todaySuccess">-</b></span>
                    </div>
                    
                    <!-- Control -->
                    <div>
                        <button class="control-btn start-btn inactive-btn" id=startBtn>
                            Start
                        </button>
                        <button class="control-btn stop-btn ml20 inactive-btn" id=stopBtn>
                            Stop / Return Home
                        </button>
                    </div>
                </div>

                <div class="dflex">
                    <!-- 상태 정보 -->
                    <div class="card w250 h105">
                        <h3>Battery</h3>
                        <span id="battery" class="fs35">- %</span>
                    </div>
                    <div class="card w250 h105">
                        <h3>State</h3>
                        <span id="state" class="fs35">-</span>
                    </div>
                    <div class="card w250 h105">
                        <h3>Detection</h3>
                        <p>Object : <span id="object">-</span></p>
                        <p>Confidence : <span id="confidence">- %</span></p>
                    </div>
                    <div class="card w250 h105">
                        <h3>Task</h3>
                        <span id="mission" class="fs35">-</span>
                    </div>
                </div>

                <div class="dflex">
                    <!-- Camera -->
                    <div class="card camera-card w46p5 mt20 mb20">
                        <h3>Camera</h3>
                        <div class="camera-area">
                            <img class="camera-area-img" id="cameraImg" width="640">
                        </div>
                    </div>
                    <!-- Map -->
                    <div class="card map-card w46p5 mt20 mb20">
                        <h3>Map</h3>
                        <div class="map-area">
                        	<img id="mapImg" class="map-area-img">
                            <canvas id="mapCanvas" class="map-area-canvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>
      	</div>
    </div>
	
	
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/style.css">

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>

</body>
</html>
