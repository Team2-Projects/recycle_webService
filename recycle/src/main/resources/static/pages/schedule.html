<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div class="container">
      	<div class="content">
      		<h2 class="header">Recycle Monitoring</h2>
            <nav class="tab-menu">
                <a href="/dashboard" class="tab">대시보드</a>
                <a href="/eventLog" class="tab">이벤트 로그</a>
                <a href="/recycleHistory" class="tab">쓰레기 수거 현황</a>
                <a href="/schedule" class="tab active">스케줄 관리</a>
                <a href="/setting" class="tab">정보 / 설정</a>
            </nav>
            
            <div class="schedule_content">
	            <div class="schedule_list_card schedule_card">
	                <div class="card_top">
	                    <div class="card_title">수거 스케줄 목록</div>
	                    <button type="button" class="btn btn_blue">
	                        + 스케줄 추가
	                    </button>
	                </div>

	                <div class="date_slider">
	                    <button type="button" class="date_arrow">
	                        &lt;
	                    </button>
	
	                    <div class="date_list">
	                    	<button type="button" class="date_item">
	                            <span class="day_name">일</span>
	                            <span class="day_num">23</span>
	                        </button>
	                        
	                        <button type="button" class="date_item">
	                            <span class="day_name">월</span>
	                            <span class="day_num">17</span>
	                        </button>
	
	                        <button type="button" class="date_item">
	                            <span class="day_name">화</span>
	                            <span class="day_num">18</span>
	                        </button>
	
	                        <button type="button" class="date_item">
	                            <span class="day_name">수</span>
	                            <span class="day_num">19</span>
	                        </button>
	
	                        <button type="button" class="date_item">
	                            <span class="day_name">목</span>
	                            <span class="day_num">20</span>
	                        </button>
	
	                        <button type="button" class="date_item active">
	                            <span class="day_name">금</span>
	                            <span class="day_num">21</span>
<!-- 	                        </button> -->
	
	                        <button type="button" class="date_item">
	                            <span class="day_name">토</span>
	                            <span class="day_num">22</span>
	                        </button>
	                    </div>
	
	                    <button type="button" class="date_arrow">
	                        &gt;
	                    </button>
	                </div>
	
					<div class="schedule_list">
	                    <button type="button" class="schedule_item active">
	                        <div class="schedule_item_row">
	                            <div class="schedule_time">
	                                09:00
	                            </div>
	                            <div class="schedule_name">
	                                오전 수거 시작sdfasdfawrbaerbhfaw
	                            </div>
	                            <div class="schedule_status wait">
	                                대기
	                            </div>
	                        </div>
	                    </button>	                    
	
	                    <button type="button" class="schedule_item">
	                        <div class="schedule_item_row">
	                            <div class="schedule_time">
	                                14:00
	                            </div>
	                            <div class="schedule_name">
	                                오후 수거 시작
	                            </div>
	                            <div class="schedule_status wait">
	                                대기
	                            </div>
	                        </div>
	                    </button>

	                </div>
	
	                <div class="voice_box">
	                    <div class="voice_box_header">
	                        <div class="voice_box_title">
	                            음성 인식 명령
	                        </div>
	                    </div>
	
	                    <div class="voice_list">
	                        <div class="voice_item">
	                            <div class="voice_text">
	                                "오전 9시에 수거 시작 등록해줘"
	                            </div>
	                            <div class="voice_date">
	                                08:35
	                            </div>
	                        </div>
	
	                        <div class="voice_item">
	                            <div class="voice_text">
	                                "내일 오후 2시에 수거 시작"
	                            </div>
	                            <div class="voice_date">
	                                08:40
	                            </div>
	                        </div>
	
	                        <div class="voice_item">
	                            <div class="voice_text">
	                                "8월 22일 10시 30분 수거 예약"
	                            </div>
	                            <div class="voice_date">
	                                08:42
	                            </div>
	                        </div>
	                        
	                        <div class="voice_item">
	                            <div class="voice_text">
	                                "8월 22일 10시 30분 수거 예약"
	                            </div>
	                            <div class="voice_date">
	                                08:42
	                            </div>
	                        </div>
	                    </div>
	                </div>
	            </div>

	            <div class="schedule_detail_card schedule_card">
	                <div class="card_top">
	                    <div>
	                        <div class="detail_title">
	                            스케줄 상세
	                        </div>
	                    </div>
						
						<div>
							<button type="button" class="btn btn_red">삭제</button>
		                    <button type="button" class="btn btn_blue">수정</button>
		                    <button type="button" class="btn btn_white">취소</button>
	                        <button type="button" class="btn btn_blue">저장</button>
						</div>
	                </div>
					
					<div class="detail_form_table">
						<table>
		                    <tbody>
		                        <tr>
		                            <th>스케줄명</th>
		                            <td>
										<input type="text" class="input_box" value="오전 수거 시작"/>
		                            </td>
		                        </tr>
		                        <tr>
		                            <th>날짜</th>
		                            <td>
		                                <input type="text" class="input_box" value="2026-08-21"/>
		                            </td>
		                        </tr>
		                        <tr>
		                            <th>실행 시간</th>
		                            <td>
		                                <input type="time" class="input_box" value="09:00"/>
		                            </td>
		                        </tr>
		                        <tr>
		                            <th>상태</th>
		                            <td>
		                                <select class="select_box status_select">
		                                    <option value="WAIT">
		                                        대기
		                                    </option>
		                                    <option value="COMPLETE">
		                                        완료
		                                    </option>
		                                    <option value="CANCEL">
		                                        취소
		                                    </option>
		                                </select>
		                            </td>
		                        </tr>
		                        <tr>
		                            <th>실행 작업</th>
		                            <td>
		                                <input type="text" class="input_box" value="로봇 쓰레기 수거 시작" readonly />
		                            </td>
		                        </tr>
		                        <tr>
		                            <th>설명</th>
		                            <td>
		                                <textarea class="textarea_box">지정된 시간에 로봇 쓰레기 수거 작업을 자동으로 시작합니다.</textarea>
		                            </td>
		                        </tr>
		                    </tbody>
		                </table>
					</div>
	            </div>
	        </div>
	    </div>
	</div>
	
	
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/style.css">

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>

</body>
</html>
