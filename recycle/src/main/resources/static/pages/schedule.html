<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div class="container">
      	<div class="content">
      		<h2 class="header">Recycle Monitoring</h2>
            <nav class="tab-menu">
                <a href="/dashboard" class="tab">대시보드</a>
                <a href="/eventLog" class="tab">이벤트 로그</a>
                <a href="/recycleHistory" class="tab">쓰레기 수거 현황</a>
                <a href="/schedule" class="tab active">스케줄 관리</a>
                <a href="/setting" class="tab">정보 / 설정</a>
            </nav>
            
            <div class="schedule_content">
	            <div class="schedule_list_card schedule_card">
	                <div class="card_top">
	                    <div class="card_title">수거 스케줄 목록</div>
	                    <button type="button" class="btn btn_blue" id="scheduleAdd">
	                        + 스케줄 추가
	                    </button>
	                </div>

	                <div class="date_slider">
	                    <button type="button" class="date_arrow" id="prevWeekBtn">
	                        &lt;
	                    </button>
	
	                    <div class="date_list" id="dateList"></div>
	
	                    <button type="button" class="date_arrow" id="nextWeekBtn">
	                        &gt;
	                    </button>
	                </div>
	
					<div class="schedule_list" id="scheduleList"></div>
	
	                <div class="voice_box">
	                    <div class="voice_box_header">
	                        <div class="voice_box_title">
	                            음성 인식 명령
	                        </div>
	                    </div>
	
	                    <div class="voice_list" id="voiceList"></div>
	                </div>
	            </div>

	            <div class="schedule_detail_card schedule_card">
	                <div class="card_top" style="height: 42px">
	                    <div>
	                        <div class="detail_title">
	                            스케줄 상세
	                        </div>
	                    </div>
						
						<div class="dflex">
		                    <button type="button" class="btn btn_blue" style="display:none" id="scheduleUpdate">수정</button>
		                    <button type="button" class="btn btn_red ml10" style="display:none" id="scheduleDelete">삭제</button>
	                        <button type="button" class="btn btn_blue ml10" style="display:none" id="scheduleSave">저장</button>
	                        <button type="button" class="btn btn_white ml10" style="display:none" id="scheduleCancel">취소</button>
						</div>
	                </div>
					
					<div class="detail_form_table">
						<table>
		                    <tbody>
		                        <tr>
		                            <th>스케줄명</th>
		                            <td>
										<input type="text" class="input_box" id="scheduleName" value="" placeholder="스케줄명" disabled/>
		                            </td>
		                        </tr>
		                        <tr>
		                            <th>날짜</th>
		                            <td>
		                                <input type="text" id="scheduleDate" class="input_box" value="" placeholder="YYYY-MM-DD" disabled/>
		                            </td>
		                        </tr>
		                        <tr>
		                            <th>실행 시간</th>
		                            <td>
		                                <input type="text" id="executeTime" class="input_box" value="" placeholder="HH:mm" disabled/>
		                            </td>
		                        </tr>
		                        <tr>
		                            <th>상태</th>
		                            <td>
		                                <select id="statusSelect" class="select_box status_select" disabled>
		                                    <option value="WAIT">
		                                        대기
		                                    </option>
		                                    <option value="COMPLETE">
		                                        완료
		                                    </option>
		                                    <option value="CANCEL">
		                                        취소
		                                    </option>
		                                </select>
		                            </td>
		                        </tr>
		                        <tr>
		                            <th>실행 작업</th>
		                            <td>
		                            	<select id="taskSelect" class="select_box" style="width: 250px" disabled>
		                                    <option value="recycleStart" selected>
		                                        쓰레기 수거 시작
		                                    </option>
		                                </select>
		                            </td>
		                        </tr>
		                        <tr>
		                            <th>설명</th>
		                            <td>
		                                <textarea class="textarea_box" id="textareaBox" disabled></textarea>
		                            </td>
		                        </tr>
		                    </tbody>
		                </table>
					</div>
	            </div>
	        </div>
	    </div>
	</div>
	
	
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/style.css">

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<link rel="stylesheet" href="js/lib/flatpickr.min.css">
<script src="/js/lib/flatpickr.min.js"></script>
<script src="/js/lib/ko.js"></script>

<script src="/js/common.js"></script>
<script src="/js/schedule.js"></script>

</body>
</html>
